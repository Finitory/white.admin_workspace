name: white-admin-workspace

services:
  admin-front:
    image: blue.admin_front:local
    build:
      context: ../blue.admin_front
      args:
        VITE_LOCAL_CONNECTIVITY_ENABLED: "true"
    volumes:
      - type: bind
        source: ../blue.admin_front/nginx/local.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:11000:8080"
    networks:
      - admin-local

  admin-bff:
    image: blue.admin_bff:local
    build:
      context: ../blue.admin_bff
    environment:
      NODE_ENV: production
      PORT: "12000"
      BLUE_LOCAL_CONNECTIVITY_ENABLED: "true"
      CONNECTIVITY_GATEWAY_URL: http://admin-gateway:12100
    ports:
      - "127.0.0.1:12000:12000"
    networks:
      - admin-local

  admin-gateway:
    image: blue.admin_gateway:local
    build:
      context: ../blue.admin_gateway
    environment:
      SPRING_PROFILES_ACTIVE: local
      CONNECTIVITY_MOCK_URL: http://admin-mock:8080
      CONNECTIVITY_AUTH_URL: http://admin-auth:12200
    ports:
      - "127.0.0.1:12100:12100"
    networks:
      - admin-local

  admin-auth:
    image: blue.admin_auth:local
    build:
      context: ../blue.admin_auth
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - type: bind
        source: ${AUTH_DEV_CONFIG:?Set AUTH_DEV_CONFIG}
        target: /app/config/application-dev.yaml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:12200:12200"
    networks:
      - admin-local

  admin-mock:
    image: nginxinc/nginx-unprivileged:stable-bookworm
    volumes:
      - ./mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - admin-local

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap_password
    secrets:
      - pg_bootstrap_password
      - admin_auth_migration_password
      - admin_auth_runtime_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - admin_auth_pgdata:/var/lib/postgresql
      - ./scripts/postgres/10-init-admin-auth.sh:/docker-entrypoint-initdb.d/10-init-admin-auth.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - admin-local


volumes:
  admin_auth_pgdata:

networks:
  admin-local:
    driver: bridge

secrets:
  pg_bootstrap_password:
    file: ./secrets/pg_bootstrap_password

  admin_auth_migration_password:
    file: ./secrets/admin_auth_migration_password

  admin_auth_runtime_password:
    file: ./secrets/admin_auth_runtime_password